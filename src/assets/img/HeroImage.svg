<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Hintergrund -->
  <rect width="800" height="600" fill="#f4f4f4"/>
  
  <!-- Laptop -->
  <rect x="250" y="200" width="300" height="180" rx="10" fill="#c0c0c0" stroke="#888" stroke-width="2"/>
  <rect x="270" y="220" width="260" height="140" fill="#ffffff" stroke="#888" stroke-width="2"/>
  
  <!-- Bildschirm-Inhalt -->
  <text x="285" y="250" font-size="24" fill="#555">Web Design</text>
  <rect x="285" y="270" width="200" height="60" fill="#e0e0e0"/>
  <rect x="290" y="275" width="190" height="50" fill="#d0d0d0" stroke="#888" stroke-width="1"/>
  
  <!-- Hände und Grafiktablet -->
  <circle cx="230" cy="400" r="30" fill="#ffcc99"/>
  <rect x="200" y="420" width="160" height="100" rx="10" fill="#333"/>
  <circle cx="290" cy="470" r="10" fill="#777"/>
  
  <!-- Farbpalette -->
  <rect x="500" y="400" width="150" height="30" fill="#fff" stroke="#888" stroke-width="1"/>
  <rect x="505" y="405" width="20" height="20" fill="#ff5733"/>
  <rect x="530" y="405" width="20" height="20" fill="#ffc300"/>
  <rect x="555" y="405" width="20" height="20" fill="#28b463"/>
  <rect x="580" y="405" width="20" height="20" fill="#3498db"/>
</svg>